plugins { id 'com.android.application' }
android {
    namespace 'net.fuyumori.stellashell'
    compileSdk 35
    defaultConfig {
        applicationId 'net.fuyumori.stellashell'
        minSdk 30
        targetSdk 34
        testInstrumentationRunner "net.fuyumori.stellashell.WidgetRenderInstrumentation"
        versionCode 20
        versionName '0.11.0'
    }
    buildFeatures { aidl true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation project(':core')
    implementation project(':feature-search')
    implementation project(':feature-launch')
    implementation project(':platform-bridge')
    compileOnly 'androidx.annotation:annotation:1.3.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
}
